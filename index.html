        function Navbar({ currentPage, setCurrentPage }) {

            const navItems = [

                { id: 'usuarios', label: 'Usuários', icon: <Icons.Users /> },
                { id: 'vagas', label: 'Vagas', icon: <Icons.Briefcase /> },
                { id: 'cursos', label: 'Cursos', icon: <Icons.Book /> },
            ];

            return (
                <nav className="bg-white shadow-lg sticky top-0 z-40 border-b border-gray-100">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-16">

                                </div>
                            </div>

                            <div className="hidden md:flex items-center gap-1">

                                    <button key={item.id} onClick={() => setCurrentPage(item.id)}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 ${
                                            currentPage === item.id ? 'bg-primary-50 text-primary-700' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'
                                        }`}>
                                        {item.icon}
                                        {item.label}
                                    </button>
                                ))}
                            </div>

                            <button className="md:hidden p-2 rounded-lg hover:bg-gray-100" onClick={() => setMobileOpen(!mobileOpen)}>
                                {mobileOpen ? <Icons.Close /> : <Icons.Menu />}
                            </button>
                        </div>
                    </div>

                    {mobileOpen && (
                        <div className="md:hidden bg-white border-t border-gray-100 animate-slide-down">
                            <div className="px-4 py-3 space-y-1">
                                {navItems.map(item => (
                                    <button key={item.id} onClick={() => { setCurrentPage(item.id); setMobileOpen(false); }}
                                        className={`flex items-center gap-3 w-full px-4 py-3 rounded-lg text-sm font-medium transition-all ${
                                            currentPage === item.id ? 'bg-primary-50 text-primary-700' : 'text-gray-600 hover:bg-gray-50'
                                        }`}>
                                        {item.icon}
                                        {item.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                </nav>
            );
        }

        function Modal({ isOpen, onClose, title, children, size = 'md' }) {
            if (!isOpen) return null;
            const sizes = { sm: 'max-w-md', md: 'max-w-lg', lg: 'max-w-2xl', xl: 'max-w-4xl' };
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay bg-black/50 animate-fade-in" onClick={onClose}>
                    <div className={`bg-white rounded-2xl shadow-2xl w-full ${sizes[size]} max-h-[90vh] overflow-hidden animate-slide-up`} onClick={e => e.stopPropagation()}>

                            <h3 className="font-display font-bold text-lg text-gray-900">{title}</h3>
                            <button onClick={onClose} className="p-2 rounded-lg hover:bg-gray-100 transition-colors"><Icons.Close /></button>
                        </div>
                        <div className="px-6 py-5 overflow-y-auto max-h-[calc(90vh-80px)]">{children}</div>
                    </div>
                </div>
            );
        }

        function ConfirmDialog({ isOpen, onClose, onConfirm, title, message }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay bg-black/50 animate-fade-in" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm animate-slide-up" onClick={e => e.stopPropagation()}>

                            </div>

                            <p className="text-gray-500 text-sm mb-6">{message}</p>
                            <div className="flex gap-3">
                                <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-gray-700 font-medium hover:bg-gray-50 transition-colors">Cancelar</button>
                                <button onClick={onConfirm} className="flex-1 px-4 py-2.5 rounded-xl bg-red-600 text-white font-medium hover:bg-red-700 transition-colors">Confirmar</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Toast({ message, type, onClose }) {
            useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
            const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-primary-500' };
            return (
                <div className={`fixed top-20 right-4 z-[60] ${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 animate-slide-down`}>
                    {type === 'success' ? <Icons.Check /> : <Icons.Alert />}
                    <span className="font-medium text-sm">{message}</span>
                </div>
            );
        }

        function StatCard({ icon, label, value, color }) {
            const colorMap = {
                blue: 'bg-primary-50 text-primary-600',
                purple: 'bg-accent-50 text-accent-600',
                green: 'bg-green-50 text-green-600',
                orange: 'bg-orange-50 text-orange-600',
            };
            return (
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 card-hover">
                    <div className="flex items-center gap-4">
                        <div className={`w-12 h-12 rounded-xl ${colorMap[color]} flex items-center justify-center`}>{icon}</div>
                        <div>
                            <p className="text-2xl font-display font-bold text-gray-900">{value}</p>
                            <p className="text-sm text-gray-500">{label}</p>
                        </div>
                    </div>
                </div>
            );
        }

        function Badge({ children, variant = 'default' }) {
            const variants = {
                default: 'bg-gray-100 text-gray-700',
                success: 'bg-green-100 text-green-700',
                warning: 'bg-amber-100 text-amber-700',
                danger: 'bg-red-100 text-red-700',
                info: 'bg-primary-100 text-primary-700',
                purple: 'bg-accent-100 text-accent-700',
            };
            return <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${variants[variant]}`}>{children}</span>;
        }

        function SearchBar({ value, onChange, placeholder }) {
            return (
                <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><Icons.Search /></div>
                    <input type="text" value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
                        className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 bg-white text-sm input-focus outline-none transition-all" />
                </div>
            );
        }

        function Tabs({ tabs, active, onChange }) {
            return (
                <div className="flex bg-gray-100 rounded-xl p-1 gap-1 mb-6 overflow-x-auto">
                    {tabs.map(tab => (
                        <button key={tab.id} onClick={() => onChange(tab.id)}
                            className={`tab-btn flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap flex-1 justify-center ${
                                active === tab.id ? 'active' : 'text-gray-600 hover:text-gray-900'
                            }`}>
                            {tab.icon}
                            {tab.label}
                            {tab.count !== undefined && (
                                <span className={`text-xs px-1.5 py-0.5 rounded-full ${active === tab.id ? 'bg-primary-100 text-primary-700' : 'bg-gray-200 text-gray-600'}`}>
                                    {tab.count}
                                </span>
                            )}
                        </button>
                    ))}
                </div>
            );
        }

                                        <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                                        <span className="text-sm font-medium">Plataforma de Oportunidades Profissionais</span>
                                    </div>

                                        <div className="relative bg-white/10 backdrop-blur-sm rounded-3xl p-8 border border-white/20">
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="bg-white/10 rounded-2xl p-5 text-center">

                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-10 relative z-10">
