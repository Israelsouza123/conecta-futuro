        // ==================== USUÁRIOS (com botão Excluir destacado) ====================
        function UsuariosPage() {
            const [users, setUsers] = useState(apiService.getAll('users'));
            const [search, setSearch] = useState('');
            const [modalOpen, setModalOpen] = useState(false);
            const [editingUser, setEditingUser] = useState(null);
            const [confirmDelete, setConfirmDelete] = useState(null);
            const [toast, setToast] = useState(null);
            const [form, setForm] = useState({ nome: '', email: '', telefone: '', cidade: '', estado: '', perfil: 'Profissional' });

            const filtered = useMemo(() => users.filter(u => u.nome.toLowerCase().includes(search.toLowerCase()) || u.cidade.toLowerCase().includes(search.toLowerCase())), [users, search]);

            const openCreate = () => { setEditingUser(null); setForm({ nome: '', email: '', telefone: '', cidade: '', estado: '', perfil: 'Profissional' }); setModalOpen(true); };
            const openEdit = (user) => { setEditingUser(user); setForm({ nome: user.nome, email: user.email, telefone: user.telefone, cidade: user.cidade, estado: user.estado, perfil: user.perfil }); setModalOpen(true); };

            const handleSave = () => {
                if (!form.nome || !form.email) { setToast({ message: 'Preencha os campos obrigatórios', type: 'error' }); return; }
                if (editingUser) {
                    apiService.update('users', editingUser.id, form);
                    setToast({ message: 'Usuário atualizado!', type: 'success' });
                } else {
                    apiService.create('users', { ...form, dataCadastro: new Date().toISOString().split('T')[0] });
                    setToast({ message: 'Usuário criado!', type: 'success' });
                }
                setUsers(apiService.getAll('users'));
                setModalOpen(false);
            };

            const handleDelete = () => {
                apiService.delete('users', confirmDelete.id);
                setUsers(apiService.getAll('users'));
                setConfirmDelete(null);
                setToast({ message: 'Usuário removido com sucesso!', type: 'success' });
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
                    {toast && <Toast {...toast} onClose={() => setToast(null)} />}

                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
                        <div>
                            <h1 className="font-display text-2xl font-bold text-gray-900">Gerenciar Usuários</h1>
                            <p className="text-gray-500 text-sm mt-1">CRUD completo de usuários da plataforma</p>
                        </div>
                        <button onClick={openCreate} className="btn-primary px-5 py-2.5 rounded-xl text-white font-medium flex items-center gap-2 text-sm w-fit">
                            <Icons.Plus /> Novo Usuário
                        </button>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-4 border-b border-gray-100">
                            <SearchBar value={search} onChange={setSearch} placeholder="Buscar por nome ou cidade..." />
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead>
                                    <tr className="bg-gray-50">
                                        <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Nome</th>
                                        <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Email</th>
                                        <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden md:table-cell">Telefone</th>
                                        <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden lg:table-cell">Cidade/UF</th>
                                        <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Perfil</th>
                                        <th className="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Ações</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-50">
                                    {filtered.map(user => (
                                        <tr key={user.id} className="hover:bg-gray-50/50 transition-colors group">
                                            <td className="px-6 py-4">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-9 h-9 rounded-full bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-white font-semibold text-sm">{user.nome.charAt(0)}</div>
                                                    <div>
                                                        <p className="font-medium text-gray-900 text-sm">{user.nome}</p>
                                                        <p className="text-xs text-gray-400">{user.dataCadastro}</p>
                                                    </div>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 text-sm text-gray-600">{user.email}</td>
                                            <td className="px-6 py-4 text-sm text-gray-600 hidden md:table-cell">{user.telefone}</td>
                                            <td className="px-6 py-4 text-sm text-gray-600 hidden lg:table-cell">{user.cidade}/{user.estado}</td>
                                            <td className="px-6 py-4"><Badge variant={user.perfil === 'Mentor' ? 'purple' : 'info'}>{user.perfil}</Badge></td>
                                            <td className="px-6 py-4">
                                                <div className="flex items-center justify-end gap-2">
                                                    <button onClick={() => openEdit(user)}
                                                        className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-primary-50 text-primary-700 hover:bg-primary-100 transition-colors text-xs font-medium"
                                                        title="Editar">
                                                        <Icons.Edit />
                                                        <span className="hidden sm:inline">Editar</span>
                                                    </button>
                                                    <button onClick={() => setConfirmDelete(user)}
                                                        className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-50 text-red-700 hover:bg-red-100 transition-colors text-xs font-medium"
                                                        title="Excluir">
                                                        <Icons.Trash />
                                                        <span className="hidden sm:inline">Excluir</span>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        {filtered.length === 0 && <div className="text-center py-12 text-gray-400">Nenhum usuário encontrado</div>}
                        <div className="px-6 py-3 bg-gray-50 border-t border-gray-100">
                            <p className="text-xs text-gray-400">{filtered.length} registro(s)</p>
                        </div>
                    </div>

                    <Modal isOpen={modalOpen} onClose={() => setModalOpen(false)} title={editingUser ? 'Editar Usuário' : 'Novo Usuário'}>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nome Completo *</label>
                                <input type="text" value={form.nome} onChange={e => setForm({...form, nome: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Digite o nome completo" />
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                                    <input type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="email@exemplo.com" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                                    <input type="text" value={form.telefone} onChange={e => setForm({...form, telefone: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="(00) 00000-0000" />
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Cidade</label>
                                    <input type="text" value={form.cidade} onChange={e => setForm({...form, cidade: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Cidade" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                                    <input type="text" value={form.estado} onChange={e => setForm({...form, estado: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="UF" maxLength={2} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Perfil</label>
                                <select value={form.perfil} onChange={e => setForm({...form, perfil: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none bg-white">
                                    <option value="Profissional">Profissional</option>
                                    <option value="Mentor">Mentor</option>
                                </select>
                            </div>
                            <div className="flex gap-3 pt-4">
                                <button onClick={() => setModalOpen(false)} className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-gray-700 font-medium hover:bg-gray-50 transition-colors text-sm">Cancelar</button>
                                <button onClick={handleSave} className="flex-1 btn-primary px-4 py-2.5 rounded-xl text-white font-medium text-sm">{editingUser ? 'Atualizar' : 'Criar'}</button>
                            </div>
                        </div>
                    </Modal>

                    <ConfirmDialog
                        isOpen={!!confirmDelete}
                        onClose={() => setConfirmDelete(null)}
                        onConfirm={handleDelete}
                        title="Excluir Usuário"
                        message={`Deseja realmente excluir o usuário "${confirmDelete?.nome}"? Esta ação não pode ser desfeita.`}
                    />
                </div>
            );
        }

        // ==================== VAGAS + CANDIDATURAS ====================
        function VagasPage() {
            const [vagas, setVagas] = useState(apiService.getAll('vagas'));
            const [candidaturas, setCandidaturas] = useState(apiService.getAll('candidaturas'));
            const [activeTab, setActiveTab] = useState('vagas');
            const [search, setSearch] = useState('');
            const [modalOpen, setModalOpen] = useState(false);
            const [editingVaga, setEditingVaga] = useState(null);
            const [candidaturaModal, setCandidaturaModal] = useState({ open: false, vaga: null });
            const [detalheCandidatura, setDetalheCandidatura] = useState(null);
            const [confirmDelete, setConfirmDelete] = useState(null);
            const [confirmCancelCand, setConfirmCancelCand] = useState(null);
            const [toast, setToast] = useState(null);
            const [viewMode, setViewMode] = useState('table');

            const [form, setForm] = useState({ titulo: '', empresa: '', modalidade: 'Remoto', salario: '', area: '', descricao: '', status: 'Aberta' });
            const [candForm, setCandForm] = useState({ candidatoNome: '', candidatoEmail: '', candidatoTelefone: '', experiencia: '', linkedin: '', apresentacao: '' });

            const filteredVagas = useMemo(() => vagas.filter(v => v.titulo.toLowerCase().includes(search.toLowerCase()) || v.empresa.toLowerCase().includes(search.toLowerCase())), [vagas, search]);
            const filteredCand = useMemo(() => candidaturas.filter(c => c.vagaTitulo.toLowerCase().includes(search.toLowerCase()) || c.candidatoNome.toLowerCase().includes(search.toLowerCase())), [candidaturas, search]);

            const openCreate = () => { setEditingVaga(null); setForm({ titulo: '', empresa: '', modalidade: 'Remoto', salario: '', area: '', descricao: '', status: 'Aberta' }); setModalOpen(true); };
            const openEdit = (vaga) => { setEditingVaga(vaga); setForm({ titulo: vaga.titulo, empresa: vaga.empresa, modalidade: vaga.modalidade, salario: vaga.salario, area: vaga.area, descricao: vaga.descricao, status: vaga.status }); setModalOpen(true); };

            const handleSaveVaga = () => {
                if (!form.titulo || !form.empresa) { setToast({ message: 'Preencha os campos obrigatórios', type: 'error' }); return; }
                if (editingVaga) {
                    apiService.update('vagas', editingVaga.id, form);
                    setToast({ message: 'Vaga atualizada!', type: 'success' });
                } else {
                    apiService.create('vagas', { ...form, dataPublicacao: new Date().toISOString().split('T')[0] });
                    setToast({ message: 'Vaga criada!', type: 'success' });
                }
                setVagas(apiService.getAll('vagas'));
                setModalOpen(false);
            };

            const handleDeleteVaga = () => {
                apiService.delete('vagas', confirmDelete.id);
                setVagas(apiService.getAll('vagas'));
                setConfirmDelete(null);
                setToast({ message: 'Vaga removida!', type: 'success' });
            };

            const openCandidatura = (vaga) => {
                setCandForm({ candidatoNome: '', candidatoEmail: '', candidatoTelefone: '', experiencia: '', linkedin: '', apresentacao: '' });
                setCandidaturaModal({ open: true, vaga });
            };

            const handleSalvarCandidatura = () => {
                const { candidatoNome, candidatoEmail, candidatoTelefone } = candForm;
                if (!candidatoNome || !candidatoEmail || !candidatoTelefone) {
                    setToast({ message: 'Preencha nome, email e telefone', type: 'error' }); return;
                }
                const vaga = candidaturaModal.vaga;
                const duplicata = candidaturas.some(c => c.vagaId === vaga.id && c.candidatoEmail.toLowerCase() === candidatoEmail.toLowerCase());
                if (duplicata) {
                    setToast({ message: 'Você já se candidatou a esta vaga com este email', type: 'error' }); return;
                }
                apiService.create('candidaturas', {
                    ...candForm,
                    vagaId: vaga.id,
                    vagaTitulo: vaga.titulo,
                    empresa: vaga.empresa,
                    dataCandidatura: new Date().toISOString().split('T')[0],
                    status: 'Pendente'
                });
                setCandidaturas(apiService.getAll('candidaturas'));
                setCandidaturaModal({ open: false, vaga: null });
                setToast({ message: 'Candidatura enviada com sucesso!', type: 'success' });
            };

            const handleCancelarCandidatura = () => {
                apiService.delete('candidaturas', confirmCancelCand.id);
                setCandidaturas(apiService.getAll('candidaturas'));
                setConfirmCancelCand(null);
                setToast({ message: 'Candidatura cancelada!', type: 'success' });
            };

            const statusCandColor = { 'Pendente': 'warning', 'Em Análise': 'info', 'Aprovado': 'success', 'Rejeitado': 'danger' };
            const modalidadeColor = { Remoto: 'success', Presencial: 'warning', Híbrido: 'info' };

            const tabs = [
                { id: 'vagas', label: 'Vagas Disponíveis', icon: <Icons.Briefcase />, count: vagas.length },
                { id: 'candidaturas', label: 'Minhas Candidaturas', icon: <Icons.Document />, count: candidaturas.length },
            ];

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
                    {toast && <Toast {...toast} onClose={() => setToast(null)} />}

                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                        <div>
                            <h1 className="font-display text-2xl font-bold text-gray-900">Vagas de Emprego</h1>
                            <p className="text-gray-500 text-sm mt-1">Explore vagas e candidate-se às oportunidades</p>
                        </div>
                        {activeTab === 'vagas' && (
                            <div className="flex items-center gap-3">
                                <div className="flex bg-gray-100 rounded-lg p-0.5">
                                    <button onClick={() => setViewMode('table')} className={`px-3 py-1.5 rounded-md text-xs font-medium transition-all ${viewMode === 'table' ? 'bg-white shadow text-gray-900' : 'text-gray-500'}`}>Tabela</button>
                                    <button onClick={() => setViewMode('cards')} className={`px-3 py-1.5 rounded-md text-xs font-medium transition-all ${viewMode === 'cards' ? 'bg-white shadow text-gray-900' : 'text-gray-500'}`}>Cards</button>
                                </div>
                                <button onClick={openCreate} className="btn-primary px-5 py-2.5 rounded-xl text-white font-medium flex items-center gap-2 text-sm">
                                    <Icons.Plus /> Nova Vaga
                                </button>
                            </div>
                        )}
                    </div>

                    <Tabs tabs={tabs} active={activeTab} onChange={setActiveTab} />

                    <div className="mb-6">
                        <SearchBar value={search} onChange={setSearch} placeholder={activeTab === 'vagas' ? 'Buscar por título ou empresa...' : 'Buscar por vaga ou candidato...'} />
                    </div>

                    {activeTab === 'vagas' && (
                        <>
                            {viewMode === 'table' ? (
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full">
                                            <thead>
                                                <tr className="bg-gray-50">
                                                    <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Vaga</th>
                                                    <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden md:table-cell">Empresa</th>
                                                    <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden lg:table-cell">Modalidade</th>
                                                    <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden lg:table-cell">Salário</th>
                                                    <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                                                    <th className="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Ações</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-50">
                                                {filteredVagas.map(vaga => (
                                                    <tr key={vaga.id} className="hover:bg-gray-50/50 transition-colors">
                                                        <td className="px-6 py-4">
                                                            <p className="font-medium text-gray-900 text-sm">{vaga.titulo}</p>
                                                            <p className="text-xs text-gray-400">{vaga.area}</p>
                                                        </td>
                                                        <td className="px-6 py-4 text-sm text-gray-600 hidden md:table-cell">{vaga.empresa}</td>
                                                        <td className="px-6 py-4 hidden lg:table-cell"><Badge variant={modalidadeColor[vaga.modalidade]}>{vaga.modalidade}</Badge></td>
                                                        <td className="px-6 py-4 text-sm text-gray-600 hidden lg:table-cell">{vaga.salario}</td>
                                                        <td className="px-6 py-4"><Badge variant={vaga.status === 'Aberta' ? 'success' : 'danger'}>{vaga.status}</Badge></td>
                                                        <td className="px-6 py-4 text-right">
                                                            <div className="flex items-center justify-end gap-1">
                                                                <button onClick={() => openCandidatura(vaga)} disabled={vaga.status !== 'Aberta'} title="Candidatar-se"
                                                                    className="p-2 rounded-lg bg-green-50 text-green-600 hover:bg-green-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                                                                    <Icons.Document />
                                                                </button>
                                                                <button onClick={() => openEdit(vaga)} className="p-2 rounded-lg hover:bg-primary-50 text-gray-400 hover:text-primary-600 transition-colors"><Icons.Edit /></button>
                                                                <button onClick={() => setConfirmDelete(vaga)} className="p-2 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-600 transition-colors"><Icons.Trash /></button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    {filteredVagas.length === 0 && <div className="text-center py-12 text-gray-400">Nenhuma vaga encontrada</div>}
                                </div>
                            ) : (
                                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    {filteredVagas.map(vaga => (
                                        <div key={vaga.id} className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 card-hover">
                                            <div className="flex items-start justify-between mb-3">
                                                <Badge variant={vaga.status === 'Aberta' ? 'success' : 'danger'}>{vaga.status}</Badge>
                                                <div className="flex gap-1">
                                                    <button onClick={() => openEdit(vaga)} className="p-1.5 rounded-lg hover:bg-primary-50 text-gray-400 hover:text-primary-600 transition-colors"><Icons.Edit /></button>
                                                    <button onClick={() => setConfirmDelete(vaga)} className="p-1.5 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-600 transition-colors"><Icons.Trash /></button>
                                                </div>
                                            </div>
                                            <h3 className="font-display font-bold text-gray-900 mb-1">{vaga.titulo}</h3>
                                            <p className="text-sm text-primary-600 font-medium mb-3">{vaga.empresa}</p>
                                            <p className="text-sm text-gray-500 mb-4 line-clamp-2">{vaga.descricao}</p>
                                            <div className="flex flex-wrap gap-2 mb-4">
                                                <Badge variant={modalidadeColor[vaga.modalidade]}>{vaga.modalidade}</Badge>
                                                <Badge>{vaga.area}</Badge>
                                            </div>
                                            <p className="text-sm font-semibold text-gray-700 mb-4">{vaga.salario}</p>
                                            <button onClick={() => openCandidatura(vaga)} disabled={vaga.status !== 'Aberta'}
                                                className="w-full btn-success px-4 py-2 rounded-xl text-white font-medium text-sm flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
                                                <Icons.Document /> Candidatar-se
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </>
                    )}

                    {activeTab === 'candidaturas' && (
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead>
                                        <tr className="bg-gray-50">
                                            <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Candidato</th>
                                            <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Vaga</th>
                                            <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden md:table-cell">Empresa</th>
                                            <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden lg:table-cell">Data</th>
                                            <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                                            <th className="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-50">
                                        {filteredCand.map(c => (
                                            <tr key={c.id} className="hover:bg-gray-50/50 transition-colors">
                                                <td className="px-6 py-4">
                                                    <p className="font-medium text-gray-900 text-sm">{c.candidatoNome}</p>
                                                    <p className="text-xs text-gray-400">{c.candidatoEmail}</p>
                                                </td>
                                                <td className="px-6 py-4 text-sm text-gray-700 font-medium">{c.vagaTitulo}</td>
                                                <td className="px-6 py-4 text-sm text-gray-600 hidden md:table-cell">{c.empresa}</td>
                                                <td className="px-6 py-4 text-sm text-gray-600 hidden lg:table-cell">{c.dataCandidatura}</td>
                                                <td className="px-6 py-4"><Badge variant={statusCandColor[c.status]}>{c.status}</Badge></td>
                                                <td className="px-6 py-4 text-right">
                                                    <div className="flex items-center justify-end gap-1">
                                                        <button onClick={() => setDetalheCandidatura(c)} className="p-2 rounded-lg hover:bg-primary-50 text-gray-400 hover:text-primary-600 transition-colors" title="Ver detalhes"><Icons.Eye /></button>
                                                        <button onClick={() => setConfirmCancelCand(c)} className="p-2 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-600 transition-colors" title="Cancelar"><Icons.Trash /></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            {filteredCand.length === 0 && (
                                <div className="text-center py-16">
                                    <div className="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4 text-gray-400"><Icons.Document /></div>
                                    <p className="text-gray-500 font-medium">Nenhuma candidatura ainda</p>
                                    <p className="text-gray-400 text-sm mt-1">Candidate-se a uma vaga para começar</p>
                                </div>
                            )}
                        </div>
                    )}

                    <Modal isOpen={modalOpen} onClose={() => setModalOpen(false)} title={editingVaga ? 'Editar Vaga' : 'Nova Vaga'} size="lg">
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Título da Vaga *</label>
                                <input type="text" value={form.titulo} onChange={e => setForm({...form, titulo: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Ex: Desenvolvedor(a) Full Stack" />
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Empresa *</label>
                                    <input type="text" value={form.empresa} onChange={e => setForm({...form, empresa: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Nome da empresa" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Área</label>
                                    <input type="text" value={form.area} onChange={e => setForm({...form, area: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Ex: Tecnologia" />
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Modalidade</label>
                                    <select value={form.modalidade} onChange={e => setForm({...form, modalidade: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none bg-white">
                                        <option>Remoto</option><option>Presencial</option><option>Híbrido</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Faixa Salarial</label>
                                    <input type="text" value={form.salario} onChange={e => setForm({...form, salario: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="R$ 3.000 - R$ 5.000" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                                <textarea value={form.descricao} onChange={e => setForm({...form, descricao: e.target.value})} rows={3} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none resize-none" placeholder="Descreva a vaga..."></textarea>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Status</label>
                                <select value={form.status} onChange={e => setForm({...form, status: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none bg-white">
                                    <option>Aberta</option><option>Fechada</option>
                                </select>
                            </div>
                            <div className="flex gap-3 pt-4">
                                <button onClick={() => setModalOpen(false)} className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-gray-700 font-medium hover:bg-gray-50 transition-colors text-sm">Cancelar</button>
                                <button onClick={handleSaveVaga} className="flex-1 btn-primary px-4 py-2.5 rounded-xl text-white font-medium text-sm">{editingVaga ? 'Atualizar' : 'Criar'}</button>
                            </div>
                        </div>
                    </Modal>

                    <Modal isOpen={candidaturaModal.open} onClose={() => setCandidaturaModal({ open: false, vaga: null })} title="Candidatar-se à Vaga" size="lg">
                        {candidaturaModal.vaga && (
                            <div className="space-y-4">
                                <div className="bg-gradient-to-br from-primary-50 to-accent-50 rounded-xl p-4 border border-primary-100">
                                    <p className="font-display font-bold text-gray-900">{candidaturaModal.vaga.titulo}</p>
                                    <p className="text-sm text-primary-700 font-medium">{candidaturaModal.vaga.empresa} · {candidaturaModal.vaga.modalidade}</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nome Completo *</label>
                                    <input type="text" value={candForm.candidatoNome} onChange={e => setCandForm({...candForm, candidatoNome: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Seu nome completo" />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                                        <input type="email" value={candForm.candidatoEmail} onChange={e => setCandForm({...candForm, candidatoEmail: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="seu@email.com" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Telefone *</label>
                                        <input type="text" value={candForm.candidatoTelefone} onChange={e => setCandForm({...candForm, candidatoTelefone: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="(00) 00000-0000" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Experiência Profissional</label>
                                    <textarea value={candForm.experiencia} onChange={e => setCandForm({...candForm, experiencia: e.target.value})} rows={2} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none resize-none" placeholder="Descreva brevemente sua experiência..."></textarea>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">LinkedIn / Portfólio</label>
                                    <input type="text" value={candForm.linkedin} onChange={e => setCandForm({...candForm, linkedin: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="linkedin.com/in/seu-perfil" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Carta de Apresentação</label>
                                    <textarea value={candForm.apresentacao} onChange={e => setCandForm({...candForm, apresentacao: e.target.value})} rows={3} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none resize-none" placeholder="Conte por que você é o candidato ideal..."></textarea>
                                </div>
                                <div className="flex gap-3 pt-4">
                                    <button onClick={() => setCandidaturaModal({ open: false, vaga: null })} className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-gray-700 font-medium hover:bg-gray-50 transition-colors text-sm">Cancelar</button>
                                    <button onClick={handleSalvarCandidatura} className="flex-1 btn-success px-4 py-2.5 rounded-xl text-white font-medium text-sm flex items-center justify-center gap-2">
                                        <Icons.Document /> Enviar Candidatura
                                    </button>
                                </div>
                            </div>
                        )}
                    </Modal>

                    <Modal isOpen={!!detalheCandidatura} onClose={() => setDetalheCandidatura(null)} title="Detalhes da Candidatura" size="lg">
                        {detalheCandidatura && (
                            <div className="space-y-4">
                                <div className="bg-gradient-to-br from-primary-50 to-accent-50 rounded-xl p-4 border border-primary-100">
                                    <p className="font-display font-bold text-gray-900">{detalheCandidatura.vagaTitulo}</p>
                                    <p className="text-sm text-primary-700 font-medium">{detalheCandidatura.empresa}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <InfoField label="Candidato" value={detalheCandidatura.candidatoNome} />
                                    <InfoField label="Email" value={detalheCandidatura.candidatoEmail} />
                                    <InfoField label="Telefone" value={detalheCandidatura.candidatoTelefone} />
                                    <InfoField label="Data" value={detalheCandidatura.dataCandidatura} />
                                </div>
                                <div>
                                    <p className="text-xs font-medium text-gray-500 uppercase mb-1">Status</p>
                                    <Badge variant={statusCandColor[detalheCandidatura.status]}>{detalheCandidatura.status}</Badge>
                                </div>
                                <div>
                                    <p className="text-xs font-medium text-gray-500 uppercase mb-1">Experiência</p>
                                    <p className="text-sm text-gray-700">{detalheCandidatura.experiencia || '—'}</p>
                                </div>
                                <div>
                                    <p className="text-xs font-medium text-gray-500 uppercase mb-1">LinkedIn</p>
                                    <p className="text-sm text-primary-600">{detalheCandidatura.linkedin || '—'}</p>
                                </div>
                                <div>
                                    <p className="text-xs font-medium text-gray-500 uppercase mb-1">Carta de Apresentação</p>
                                    <p className="text-sm text-gray-700 bg-gray-50 rounded-lg p-3">{detalheCandidatura.apresentacao || '—'}</p>
                                </div>
                            </div>
                        )}
                    </Modal>

                    <ConfirmDialog isOpen={!!confirmDelete} onClose={() => setConfirmDelete(null)} onConfirm={handleDeleteVaga} title="Excluir Vaga" message={`Deseja excluir "${confirmDelete?.titulo}"?`} />
                    <ConfirmDialog isOpen={!!confirmCancelCand} onClose={() => setConfirmCancelCand(null)} onConfirm={handleCancelarCandidatura} title="Cancelar Candidatura" message={`Deseja cancelar sua candidatura para "${confirmCancelCand?.vagaTitulo}"?`} />
                </div>
            );
        }

        function InfoField({ label, value }) {
            return (
                <div>
                    <p className="text-xs font-medium text-gray-500 uppercase mb-1">{label}</p>
                    <p className="text-sm text-gray-700 font-medium">{value || '—'}</p>
                </div>
            );
        }

        // ==================== CURSOS + INSCRIÇÕES ====================
        function CursosPage() {
            const [cursos, setCursos] = useState(apiService.getAll('cursos'));
            const [inscricoes, setInscricoes] = useState(apiService.getAll('inscricoes'));
            const [activeTab, setActiveTab] = useState('cursos');
            const [search, setSearch] = useState('');
            const [modalOpen, setModalOpen] = useState(false);
            const [editingCurso, setEditingCurso] = useState(null);
            const [inscricaoModal, setInscricaoModal] = useState({ open: false, curso: null });
            const [detalheInscricao, setDetalheInscricao] = useState(null);
            const [confirmDelete, setConfirmDelete] = useState(null);
            const [confirmCancelIns, setConfirmCancelIns] = useState(null);
            const [toast, setToast] = useState(null);

            const [form, setForm] = useState({ titulo: '', instrutor: '', duracao: '', modalidade: 'Online', categoria: '', vagas: '', inscritos: 0, status: 'Ativo' });
            const [inscForm, setInscForm] = useState({ alunoNome: '', alunoEmail: '', alunoTelefone: '', formacao: '', motivacao: '' });

            const filteredCursos = useMemo(() => cursos.filter(c => c.titulo.toLowerCase().includes(search.toLowerCase()) || c.categoria.toLowerCase().includes(search.toLowerCase())), [cursos, search]);
            const filteredIns = useMemo(() => inscricoes.filter(i => i.cursoTitulo.toLowerCase().includes(search.toLowerCase()) || i.alunoNome.toLowerCase().includes(search.toLowerCase())), [inscricoes, search]);

            const openCreate = () => { setEditingCurso(null); setForm({ titulo: '', instrutor: '', duracao: '', modalidade: 'Online', categoria: '', vagas: '', inscritos: 0, status: 'Ativo' }); setModalOpen(true); };
            const openEdit = (curso) => { setEditingCurso(curso); setForm({ titulo: curso.titulo, instrutor: curso.instrutor, duracao: curso.duracao, modalidade: curso.modalidade, categoria: curso.categoria, vagas: curso.vagas, inscritos: curso.inscritos, status: curso.status }); setModalOpen(true); };

            const handleSaveCurso = () => {
                if (!form.titulo || !form.instrutor) { setToast({ message: 'Preencha os campos obrigatórios', type: 'error' }); return; }
                const data = { ...form, vagas: parseInt(form.vagas) || 0, inscritos: parseInt(form.inscritos) || 0 };
                if (editingCurso) {
                    apiService.update('cursos', editingCurso.id, data);
                    setToast({ message: 'Curso atualizado!', type: 'success' });
                } else {
                    apiService.create('cursos', data);
                    setToast({ message: 'Curso criado!', type: 'success' });
                }
                setCursos(apiService.getAll('cursos'));
                setModalOpen(false);
            };

            const handleDeleteCurso = () => {
                apiService.delete('cursos', confirmDelete.id);
                setCursos(apiService.getAll('cursos'));
                setConfirmDelete(null);
                setToast({ message: 'Curso removido!', type: 'success' });
            };

            const openInscricao = (curso) => {
                setInscForm({ alunoNome: '', alunoEmail: '', alunoTelefone: '', formacao: '', motivacao: '' });
                setInscricaoModal({ open: true, curso });
            };

            const handleSalvarInscricao = () => {
                const { alunoNome, alunoEmail, alunoTelefone } = inscForm;
                if (!alunoNome || !alunoEmail || !alunoTelefone) {
                    setToast({ message: 'Preencha nome, email e telefone', type: 'error' }); return;
                }
                const curso = inscricaoModal.curso;
                const duplicata = inscricoes.some(i => i.cursoId === curso.id && i.alunoEmail.toLowerCase() === alunoEmail.toLowerCase());
                if (duplicata) {
                    setToast({ message: 'Este email já está inscrito neste curso', type: 'error' }); return;
                }
                if (curso.inscritos >= curso.vagas) {
                    setToast({ message: 'Curso lotado!', type: 'error' }); return;
                }
                apiService.create('inscricoes', {
                    ...inscForm,
                    cursoId: curso.id,
                    cursoTitulo: curso.titulo,
                    dataInscricao: new Date().toISOString().split('T')[0],
                    status: 'Pendente'
                });
                apiService.update('cursos', curso.id, { inscritos: curso.inscritos + 1 });
                setInscricoes(apiService.getAll('inscricoes'));
                setCursos(apiService.getAll('cursos'));
                setInscricaoModal({ open: false, curso: null });
                setToast({ message: 'Inscrição realizada com sucesso!', type: 'success' });
            };

            const handleCancelarInscricao = () => {
                const insc = confirmCancelIns;
                const curso = cursos.find(c => c.id === insc.cursoId);
                apiService.delete('inscricoes', insc.id);
                if (curso && curso.inscritos > 0) {
                    apiService.update('cursos', curso.id, { inscritos: curso.inscritos - 1 });
                    setCursos(apiService.getAll('cursos'));
                }
                setInscricoes(apiService.getAll('inscricoes'));
                setConfirmCancelIns(null);
                setToast({ message: 'Inscrição cancelada!', type: 'success' });
            };

            const getProgress = (inscritos, vagas) => vagas > 0 ? Math.round((inscritos / vagas) * 100) : 0;
            const statusInsColor = { 'Pendente': 'warning', 'Aprovado': 'success', 'Rejeitado': 'danger', 'Concluído': 'info' };

            const tabs = [
                { id: 'cursos', label: 'Cursos Disponíveis', icon: <Icons.Book />, count: cursos.length },
                { id: 'inscricoes', label: 'Minhas Inscrições', icon: <Icons.Graduate />, count: inscricoes.length },
            ];

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
                    {toast && <Toast {...toast} onClose={() => setToast(null)} />}

                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                        <div>
                            <h1 className="font-display text-2xl font-bold text-gray-900">Cursos de Capacitação</h1>
                            <p className="text-gray-500 text-sm mt-1">Explore cursos e inscreva-se como aluno</p>
                        </div>
                        {activeTab === 'cursos' && (
                            <button onClick={openCreate} className="btn-primary px-5 py-2.5 rounded-xl text-white font-medium flex items-center gap-2 text-sm">
                                <Icons.Plus /> Novo Curso
                            </button>
                        )}
                    </div>

                    <Tabs tabs={tabs} active={activeTab} onChange={setActiveTab} />

                    <div className="mb-6">
                        <SearchBar value={search} onChange={setSearch} placeholder={activeTab === 'cursos' ? 'Buscar por título ou categoria...' : 'Buscar por curso ou aluno...'} />
                    </div>

                    {activeTab === 'cursos' && (
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
                            {filteredCursos.map(curso => {
                                const progress = getProgress(curso.inscritos, curso.vagas);
                                const isFull = curso.inscritos >= curso.vagas;
                                return (
                                    <div key={curso.id} className="bg-white rounded-2xl shadow-sm border border-gray-100 card-hover overflow-hidden">
                                        <div className={`h-2 ${isFull ? 'bg-gradient-to-r from-red-400 to-red-500' : 'bg-gradient-to-r from-primary-400 to-accent-500'}`}></div>
                                        <div className="p-6">
                                            <div className="flex items-start justify-between mb-3">
                                                <Badge variant={curso.status === 'Ativo' ? 'success' : 'warning'}>{curso.status}</Badge>
                                                <div className="flex gap-1">
                                                    <button onClick={() => openEdit(curso)} className="p-1.5 rounded-lg hover:bg-primary-50 text-gray-400 hover:text-primary-600 transition-colors"><Icons.Edit /></button>
                                                    <button onClick={() => setConfirmDelete(curso)} className="p-1.5 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-600 transition-colors"><Icons.Trash /></button>
                                                </div>
                                            </div>
                                            <h3 className="font-display font-bold text-gray-900 mb-1">{curso.titulo}</h3>
                                            <p className="text-sm text-primary-600 font-medium mb-3">{curso.instrutor}</p>

                                            <div className="grid grid-cols-2 gap-3 mb-4">
                                                <div className="bg-gray-50 rounded-lg p-2.5 text-center">
                                                    <p className="text-xs text-gray-400">Duração</p>
                                                    <p className="text-sm font-semibold text-gray-700">{curso.duracao}</p>
                                                </div>
                                                <div className="bg-gray-50 rounded-lg p-2.5 text-center">
                                                    <p className="text-xs text-gray-400">Modalidade</p>
                                                    <p className="text-sm font-semibold text-gray-700">{curso.modalidade}</p>
                                                </div>
                                            </div>

                                            <div className="mb-4">
                                                <div className="flex justify-between text-xs mb-1">
                                                    <span className="text-gray-500">{curso.inscritos}/{curso.vagas} inscritos</span>
                                                    <span className={`font-medium ${isFull ? 'text-red-600' : 'text-primary-600'}`}>{progress}%</span>
                                                </div>
                                                <div className="w-full bg-gray-100 rounded-full h-2">
                                                    <div className={`h-2 rounded-full transition-all ${isFull ? 'bg-red-500' : 'bg-gradient-to-r from-primary-500 to-accent-500'}`} style={{width: `${Math.min(progress, 100)}%`}}></div>
                                                </div>
                                            </div>

                                            <div className="flex items-center justify-between mb-4">
                                                <Badge>{curso.categoria}</Badge>
                                                {isFull && <span className="text-xs text-red-600 font-medium">Lotado</span>}
                                            </div>

                                            <button onClick={() => openInscricao(curso)} disabled={isFull || curso.status !== 'Ativo'}
                                                className="w-full btn-success px-4 py-2 rounded-xl text-white font-medium text-sm flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
                                                <Icons.Graduate /> Inscrever-se
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {activeTab === 'inscricoes' && (
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead>
                                        <tr className="bg-gray-50">
                                            <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Aluno</th>
                                            <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Curso</th>
                                            <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden md:table-cell">Formação</th>
                                            <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden lg:table-cell">Data</th>
                                            <th className="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                                            <th className="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-50">
                                        {filteredIns.map(i => (
                                            <tr key={i.id} className="hover:bg-gray-50/50 transition-colors">
                                                <td className="px-6 py-4">
                                                    <p className="font-medium text-gray-900 text-sm">{i.alunoNome}</p>
                                                    <p className="text-xs text-gray-400">{i.alunoEmail}</p>
                                                </td>
                                                <td className="px-6 py-4 text-sm text-gray-700 font-medium">{i.cursoTitulo}</td>
                                                <td className="px-6 py-4 text-sm text-gray-600 hidden md:table-cell">{i.formacao || '—'}</td>
                                                <td className="px-6 py-4 text-sm text-gray-600 hidden lg:table-cell">{i.dataInscricao}</td>
                                                <td className="px-6 py-4"><Badge variant={statusInsColor[i.status]}>{i.status}</Badge></td>
                                                <td className="px-6 py-4 text-right">
                                                    <div className="flex items-center justify-end gap-1">
                                                        <button onClick={() => setDetalheInscricao(i)} className="p-2 rounded-lg hover:bg-primary-50 text-gray-400 hover:text-primary-600 transition-colors" title="Ver detalhes"><Icons.Eye /></button>
                                                        <button onClick={() => setConfirmCancelIns(i)} className="p-2 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-600 transition-colors" title="Cancelar"><Icons.Trash /></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            {filteredIns.length === 0 && (
                                <div className="text-center py-16">
                                    <div className="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4 text-gray-400"><Icons.Graduate /></div>
                                    <p className="text-gray-500 font-medium">Nenhuma inscrição ainda</p>
                                    <p className="text-gray-400 text-sm mt-1">Inscreva-se em um curso para começar</p>
                                </div>
                            )}
                        </div>
                    )}

                    <Modal isOpen={modalOpen} onClose={() => setModalOpen(false)} title={editingCurso ? 'Editar Curso' : 'Novo Curso'} size="lg">
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Título do Curso *</label>
                                <input type="text" value={form.titulo} onChange={e => setForm({...form, titulo: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Ex: Desenvolvimento Web com React" />
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Instrutor(a) *</label>
                                    <input type="text" value={form.instrutor} onChange={e => setForm({...form, instrutor: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Nome do instrutor" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                                    <input type="text" value={form.categoria} onChange={e => setForm({...form, categoria: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Ex: Tecnologia" />
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Duração</label>
                                    <input type="text" value={form.duracao} onChange={e => setForm({...form, duracao: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Ex: 40 horas" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Modalidade</label>
                                    <select value={form.modalidade} onChange={e => setForm({...form, modalidade: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none bg-white">
                                        <option>Online</option><option>Presencial</option><option>Híbrido</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Vagas</label>
                                    <input type="number" value={form.vagas} onChange={e => setForm({...form, vagas: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="30" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Status</label>
                                <select value={form.status} onChange={e => setForm({...form, status: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none bg-white">
                                    <option>Ativo</option><option>Lotado</option><option>Encerrado</option>
                                </select>
                            </div>
                            <div className="flex gap-3 pt-4">
                                <button onClick={() => setModalOpen(false)} className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-gray-700 font-medium hover:bg-gray-50 transition-colors text-sm">Cancelar</button>
                                <button onClick={handleSaveCurso} className="flex-1 btn-primary px-4 py-2.5 rounded-xl text-white font-medium text-sm">{editingCurso ? 'Atualizar' : 'Criar'}</button>
                            </div>
                        </div>
                    </Modal>

                    <Modal isOpen={inscricaoModal.open} onClose={() => setInscricaoModal({ open: false, curso: null })} title="Inscrição no Curso" size="lg">
                        {inscricaoModal.curso && (
                            <div className="space-y-4">
                                <div className="bg-gradient-to-br from-primary-50 to-accent-50 rounded-xl p-4 border border-primary-100">
                                    <p className="font-display font-bold text-gray-900">{inscricaoModal.curso.titulo}</p>
                                    <p className="text-sm text-primary-700 font-medium">{inscricaoModal.curso.instrutor} · {inscricaoModal.curso.duracao}</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nome Completo do Aluno *</label>
                                    <input type="text" value={inscForm.alunoNome} onChange={e => setInscForm({...inscForm, alunoNome: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Nome completo" />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                                        <input type="email" value={inscForm.alunoEmail} onChange={e => setInscForm({...inscForm, alunoEmail: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="aluno@email.com" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Telefone *</label>
                                        <input type="text" value={inscForm.alunoTelefone} onChange={e => setInscForm({...inscForm, alunoTelefone: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="(00) 00000-0000" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Formação Acadêmica</label>
                                    <input type="text" value={inscForm.formacao} onChange={e => setInscForm({...inscForm, formacao: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none" placeholder="Ex: Ensino Médio Completo, Graduação em..." />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Motivação para o Curso</label>
                                    <textarea value={inscForm.motivacao} onChange={e => setInscForm({...inscForm, motivacao: e.target.value})} rows={3} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm input-focus outline-none resize-none" placeholder="Conte por que deseja fazer este curso..."></textarea>
                                </div>
                                <div className="flex gap-3 pt-4">
                                    <button onClick={() => setInscricaoModal({ open: false, curso: null })} className="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-gray-700 font-medium hover:bg-gray-50 transition-colors text-sm">Cancelar</button>
                                    <button onClick={handleSalvarInscricao} className="flex-1 btn-success px-4 py-2.5 rounded-xl text-white font-medium text-sm flex items-center justify-center gap-2">
                                        <Icons.Graduate /> Confirmar Inscrição
                                    </button>
                                </div>
                            </div>
                        )}
                    </Modal>

                    <Modal isOpen={!!detalheInscricao} onClose={() => setDetalheInscricao(null)} title="Detalhes da Inscrição" size="lg">
                        {detalheInscricao && (
                            <div className="space-y-4">
                                <div className="bg-gradient-to-br from-primary-50 to-accent-50 rounded-xl p-4 border border-primary-100">
                                    <p className="font-display font-bold text-gray-900">{detalheInscricao.cursoTitulo}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <InfoField label="Aluno" value={detalheInscricao.alunoNome} />
                                    <InfoField label="Email" value={detalheInscricao.alunoEmail} />
                                    <InfoField label="Telefone" value={detalheInscricao.alunoTelefone} />
                                    <InfoField label="Data" value={detalheInscricao.dataInscricao} />
                                </div>
                                <div>
                                    <p className="text-xs font-medium text-gray-500 uppercase mb-1">Status</p>
                                    <Badge variant={statusInsColor[detalheInscricao.status]}>{detalheInscricao.status}</Badge>
                                </div>
                                <div>
                                    <p className="text-xs font-medium text-gray-500 uppercase mb-1">Formação</p>
                                    <p className="text-sm text-gray-700">{detalheInscricao.formacao || '—'}</p>
                                </div>
                                <div>
                                    <p className="text-xs font-medium text-gray-500 uppercase mb-1">Motivação</p>
                                    <p className="text-sm text-gray-700 bg-gray-50 rounded-lg p-3">{detalheInscricao.motivacao || '—'}</p>
                                </div>
                            </div>
                        )}
                    </Modal>

                    <ConfirmDialog isOpen={!!confirmDelete} onClose={() => setConfirmDelete(null)} onConfirm={handleDeleteCurso} title="Excluir Curso" message={`Deseja excluir "${confirmDelete?.titulo}"?`} />
                    <ConfirmDialog isOpen={!!confirmCancelIns} onClose={() => setConfirmCancelIns(null)} onConfirm={handleCancelarInscricao} title="Cancelar Inscrição" message={`Deseja cancelar sua inscrição em "${confirmCancelIns?.cursoTitulo}"?`} />
                </div>
            );
        }

        function Footer() {
            return (
                <footer className="bg-gray-900 text-white mt-20">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                        <div className="grid md:grid-cols-2 gap-8">
                            <div>
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center">
                                        <span className="text-white font-bold text-lg">C</span>
                                    </div>
                                    <div>
                                        <h3 className="font-display font-bold text-lg">Conecta Futuros</h3>
                                        <p className="text-xs text-gray-400">Programa Transforma Futuros</p>
                                    </div>
                                </div>
                                <p className="text-sm text-gray-400 leading-relaxed">Plataforma de conexão entre adultos e oportunidades de emprego e capacitação profissional, com inscrição e candidatura simplificadas.</p>
                            </div>
                            <div>
                                <h4 className="font-display font-bold mb-4">Nossa Missão</h4>
                                <p className="text-sm text-gray-400 leading-relaxed">Promover inclusão produtiva, reduzir desigualdades e fomentar o crescimento econômico sustentável, conectando pessoas a oportunidades reais de transformação profissional.</p>
                            </div>
                        </div>
                        <div className="border-t border-white/10 mt-8 pt-8 text-center">
                            <p className="text-sm text-gray-500">© 2024 Conecta Futuros — Projeto Final do Programa Transforma Futuros. Todos os direitos reservados.</p>
                        </div>
                    </div>
                </footer>
            );
        }

        function App() {
            const [currentPage, setCurrentPage] = useState('home');

            const renderPage = () => {
                switch(currentPage) {
                    case 'home': return <HomePage setCurrentPage={setCurrentPage} />;
                    case 'usuarios': return <UsuariosPage />;
                    case 'vagas': return <VagasPage />;
                    case 'cursos': return <CursosPage />;
                    default: return <HomePage setCurrentPage={setCurrentPage} />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar currentPage={currentPage} setCurrentPage={setCurrentPage} />
                    <main className="flex-1">{renderPage()}</main>
                    <Footer />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
